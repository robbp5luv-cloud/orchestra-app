<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 The Vault: Multi-Agent Orchestrator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <h1 class="text-3xl font-bold text-center bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                🔒 The Vault: Multi-Agent Orchestrator
            </h1>
            <div class="flex justify-center gap-6 mt-2 text-sm text-slate-400">
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    Claude 4.5
                </span>
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    Gemini 1.5 Pro
                </span>
                <span class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    Grok 4.1
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto px-6 py-8 pb-32">

        <!-- Status Card -->
        <div id="statusCard" class="max-w-2xl mx-auto bg-slate-800/50 backdrop-blur-sm border border-slate-700 rounded-lg p-6 shadow-xl">
            <div class="flex items-center justify-between">
                <div>
                    <h2 id="statusText" class="text-xl font-semibold text-slate-200">Ready for input</h2>
                    <p class="text-sm text-slate-400 mt-1">Enter your query below to orchestrate AI agents</p>
                </div>
                <div class="flex gap-2">
                    <div class="led-dot led-blue"></div>
                    <div class="led-dot led-green"></div>
                    <div class="led-dot led-slate"></div>
                </div>
            </div>
        </div>

        <!-- Agent Responses Container -->
        <div id="agentResponses" class="max-w-4xl mx-auto mt-8 space-y-4">
            <!-- Agent responses will be dynamically inserted here -->
        </div>

    </main>

    <!-- Fixed Bottom Input Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-700 shadow-2xl">
        <div class="container mx-auto px-6 py-4">
            <div class="max-w-4xl mx-auto flex gap-3">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Enter your prompt to orchestrate agents..."
                    class="flex-1 px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-white placeholder-slate-400"
                    autocomplete="off"
                >
                <button
                    id="submitBtn"
                    class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 rounded-lg font-semibold transition-all duration-200 shadow-lg hover:shadow-xl active:scale-95"
                >
                    Orchestrate
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
